<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="nt.page_title">Uusi välilehti — Viima</title>
    <link rel="icon" type="image/png" href="viima-logo.png">
    <style>
        /* Start page = a board of widgets on a 12-column grid. Flat panels, 1px rules,
           tabular numerals. Fonts are the ones Windows ships: pages can't load web fonts. */
        :root {
            --page: #0e0f12;
            --panel: rgba(14, 15, 18, 0.8);
            --text: #ecebe6;
            --dim: #9a9a94;
            --line: rgba(255, 255, 255, 0.16);
            --accent: #4cc9f0;
            --on-accent: #06222b;
            --up: #3ddc97;
            --down: #ff6b6b;
            --sans: "Bahnschrift", "Segoe UI Variable Text", "Segoe UI", sans-serif;
            --mono: "Cascadia Mono", "Cascadia Code", Consolas, monospace;
            color-scheme: dark;
        }

        :root[data-theme="light"] {
            --page: #f4f3ee;
            --panel: rgba(250, 249, 245, 0.9);
            --text: #16171a;
            --dim: #5e5e58;
            --line: rgba(0, 0, 0, 0.18);
            --accent: #0a6c8e;
            --on-accent: #ffffff;
            --up: #0e8a5a;
            --down: #c73e3e;
            color-scheme: light;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--page);
            color: var(--text);
            font: 400 14px/1.4 var(--sans);
            min-height: 100vh;
            user-select: none;
            overflow-x: hidden;
        }

        button, input, select { font: inherit; color: inherit; }
        button { cursor: pointer; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* Wallpaper + flat scrim (keeps panel text readable on any picture) */
        .bg-wallpaper, .bg-scrim { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .bg-wallpaper { background-size: cover; background-position: center; opacity: 0; transition: opacity 0.3s; }
        .bg-wallpaper.visible { opacity: 1; }
        .bg-scrim { opacity: 0; }
        body[data-bg-tone="dark"] .bg-scrim { opacity: 1; background: rgba(8, 9, 12, 0.5); }
        body[data-bg-tone="light"] .bg-scrim { opacity: 1; background: rgba(244, 243, 238, 0.5); }

        .board {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 16px;
            align-content: start;
            padding: 32px 40px 96px;
            min-height: 100vh;
        }

        .private-note {
            display: none;
            grid-column: 1 / -1;
            padding: 8px 16px;
            border: 1px solid var(--line);
            border-left: 3px solid #a855f7;
            background: var(--panel);
            font-size: 13px;
        }
        html[data-private] .private-note { display: block; }

        /* Widget panel */
        .w {
            grid-column: span var(--span, 4);
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 16px 20px 20px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 2px;
        }

        .w-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: 20px;
            font: 600 11px/1 var(--mono);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--dim);
        }

        .w-head .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .w-tools { display: none; gap: 4px; flex-shrink: 0; }
        body.editing .w { outline: 1px dashed var(--accent); outline-offset: 3px; }
        body.editing .w-tools { display: flex; }

        .tool {
            min-width: 24px;
            height: 24px;
            padding: 0 6px;
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 2px;
            font: 600 11px/1 var(--mono);
            letter-spacing: 0;
            text-transform: none;
            color: var(--text);
        }
        .tool:hover { border-color: var(--accent); color: var(--accent); }
        .tool[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

        .opts {
            display: none;
            flex-direction: column;
            gap: 10px;
            padding: 12px;
            border: 1px dashed var(--line);
            font-size: 13px;
        }
        .w.open .opts { display: flex; }
        .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .field > span { color: var(--dim); }
        .field select, .field input[type="text"] {
            min-width: 0;
            max-width: 60%;
            padding: 4px 8px;
            background: var(--page);
            border: 1px solid var(--line);
            border-radius: 2px;
            user-select: text;
        }
        .field input[type="color"] { width: 40px; height: 24px; padding: 0; border: 1px solid var(--line); background: none; }
        .field input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
        .btn {
            padding: 4px 10px;
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 2px;
            font: 600 12px/1.4 var(--mono);
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
        .btn.primary:hover { color: var(--on-accent); filter: brightness(1.1); }
        .results { display: flex; flex-direction: column; gap: 4px; }
        .results .btn { text-align: left; font-family: var(--sans); font-weight: 400; }
        .muted { color: var(--dim); font-size: 12px; }

        /* Search */
        .search-form { display: flex; align-items: center; gap: 12px; border-bottom: 2px solid var(--text); padding-bottom: 4px; }
        .search-form:focus-within { border-color: var(--accent); }
        .search-input {
            flex: 1;
            min-width: 0;
            height: 44px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 20px;
            user-select: text;
        }
        .search-input::placeholder { color: var(--dim); }
        .search-go { color: var(--dim); font: 600 12px var(--mono); letter-spacing: 0.1em; }

        /* Clock */
        .clock { container-type: inline-size; display: flex; flex-direction: column; gap: 6px; }
        .clock[data-align="center"] { align-items: center; text-align: center; }
        .clock-time {
            --ff: 1;
            font-size: clamp(32px, calc(var(--cs) * var(--ff)), 168px);
            line-height: 1;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
            font-family: var(--sans);
            font-weight: 400;
            color: var(--clock-color, var(--text));
            white-space: nowrap;
        }
        .clock-time[data-font="thin"] { font-weight: 200; }
        .clock-time[data-font="bold"] { font-weight: 700; }
        .clock-time[data-font="mono"] { font-family: var(--mono); --ff: 0.9; letter-spacing: -0.04em; }
        .clock[data-size="s"] { --cs: 9cqi; }
        .clock[data-size="m"] { --cs: 12cqi; }
        .clock[data-size="l"] { --cs: 16cqi; }
        .clock[data-size="xl"] { --cs: 20cqi; }
        .clock-date { font-size: 16px; color: var(--dim); }
        .clock-greet { font-size: 14px; font-weight: 600; letter-spacing: 0.04em; }
        .analog { width: min(100%, 240px); aspect-ratio: 1; color: var(--clock-color, var(--text)); }

        /* Weather */
        .wx-now { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
        .wx-temp { font: 300 56px/1 var(--mono); letter-spacing: -0.04em; }
        .wx-cond { font-size: 16px; }
        .wx-sub { color: var(--dim); font-size: 13px; }
        .wx-days { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
        .wx-day { padding: 10px 8px 0; display: flex; flex-direction: column; gap: 2px; }
        .wx-day + .wx-day { border-left: 1px solid var(--line); }
        .wx-day b { font: 600 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
        .wx-day .range { font: 400 14px var(--mono); }
        .wx-day .what { font-size: 12px; color: var(--dim); }

        /* Quotes */
        .quotes { width: 100%; border-collapse: collapse; }
        .quotes td { padding: 8px 0; border-top: 1px solid var(--line); vertical-align: baseline; }
        .quotes tr:first-child td { border-top: none; padding-top: 0; }
        .q-sym { font: 600 13px var(--mono); }
        .q-name { display: block; max-width: 18ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--dim); }
        .q-price, .q-chg { text-align: right; font: 400 14px var(--mono); white-space: nowrap; padding-left: 12px; }
        .up { color: var(--up); }
        .down { color: var(--down); }
        .stale { opacity: 0.55; }
        .rm { margin-left: 8px; }

        /* Shortcuts */
        .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
        .tile {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            padding: 12px 14px;
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            color: inherit;
            text-decoration: none;
        }
        .tile:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
        .tile-icon { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font: 700 12px var(--mono); border: 1px solid var(--line); }
        .tile-icon:has(img) { background: #f4f3ee; border-color: transparent; } /* dark icons stay visible */
        .tile-icon img { width: 20px; height: 20px; object-fit: contain; }
        .w[data-type="search"] .w-head { display: none; }
        body.editing .w[data-type="search"] .w-head { display: flex; }
        .tile-text { min-width: 0; display: flex; flex-direction: column; }
        .tile-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tile-desc { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .foot { grid-column: 1 / -1; padding-top: 8px; font: 400 11px var(--mono); color: var(--dim); letter-spacing: 0.04em; }
        body[data-bg-tone="dark"] .foot { color: rgba(236, 235, 230, 0.8); }
        body[data-bg-tone="light"] .foot { color: #2b2b27; }

        /* Dock: wallpaper + edit controls */
        .dock { position: fixed; right: 24px; bottom: 16px; z-index: 10; display: flex; gap: 8px; align-items: flex-end; }
        .dock .btn { background: var(--panel); padding: 8px 12px; }
        .dock .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
        .menu {
            position: absolute;
            right: 0;
            bottom: 44px;
            min-width: 232px;
            display: none;
            flex-direction: column;
            padding: 4px;
            background: var(--page);
            border: 1px solid var(--line);
        }
        .menu.open { display: flex; }
        .menu-title { padding: 6px 8px; font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
        .menu-opt { display: flex; align-items: center; gap: 10px; padding: 6px 8px; background: transparent; border: 1px solid transparent; text-align: left; font-size: 13px; }
        .menu-opt:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
        .menu-opt.active { border-color: var(--accent); }
        .thumb { width: 36px; height: 22px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--line); }
        .thumb-auto { background: linear-gradient(90deg, #0b192c 50%, #dce7f5 50%); }
        .thumb-none { background: var(--page); }
        .menu-wrap { position: relative; }
        .edit-only { display: none; }
        body.editing .edit-only { display: block; }

        @media (max-width: 900px) {
            .board { padding: 16px 16px 96px; }
            .w { grid-column: 1 / -1; }
        }

        @media (prefers-reduced-motion: no-preference) {
            .w { animation: rise 0.28s ease-out backwards; animation-delay: calc(var(--i, 0) * 40ms); }
            @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
        }
    </style>
</head>
<body>
    <div class="bg-wallpaper" id="bgWallpaper" aria-hidden="true"></div>
    <div class="bg-scrim" aria-hidden="true"></div>

    <main class="board" id="board">
        <div class="private-note" data-i18n="nt.private">Olet yksityisessä ikkunassa. Historia, evästeet ja sivustotiedot poistetaan, kun suljet sen.</div>
    </main>

    <div class="dock">
        <div class="menu-wrap edit-only" id="addWrap">
            <div class="menu" id="addMenu" role="menu"></div>
            <button type="button" class="btn" id="btnAdd" data-i18n="nt.add">+ Lisää widget</button>
        </div>
        <button type="button" class="btn edit-only" id="btnReset" data-i18n="nt.reset">Palauta oletukset</button>
        <div class="menu-wrap" id="wallpaperPicker">
            <div class="menu" id="wallpaperMenu" role="menu">
                <div class="menu-title" data-i18n="nt.wallpaper_menu">Aloitussivun tausta</div>
                <button type="button" class="menu-opt" data-wallpaper="auto"><span class="thumb thumb-auto"></span><span data-i18n="nt.wp_auto">Automaattinen (Teema)</span></button>
                <button type="button" class="menu-opt" data-wallpaper="aurora-dark"><img class="thumb" src="/wallpapers/aurora-dark.jpg" alt=""><span data-i18n="nt.wp_aurora">Revontulet (Tumma)</span></button>
                <button type="button" class="menu-opt" data-wallpaper="glass-waves"><img class="thumb" src="/wallpapers/glass-waves.jpg" alt=""><span data-i18n="nt.wp_glass">Lasiaallot (Tumma)</span></button>
                <button type="button" class="menu-opt" data-wallpaper="nordic-light"><img class="thumb" src="/wallpapers/nordic-light.jpg" alt=""><span data-i18n="nt.wp_nordic">Pohjoinen aamu (Vaalea)</span></button>
                <button type="button" class="menu-opt" data-wallpaper="none"><span class="thumb thumb-none"></span><span data-i18n="nt.wp_none">Pelkkä väri</span></button>
            </div>
            <button type="button" class="btn" id="wallpaperBtn" title="Vaihda aloitussivun taustakuva" data-i18n="nt.wallpaper" data-i18n-title="nt.wallpaper_title">Taustakuva</button>
        </div>
        <button type="button" class="btn" id="btnEdit" aria-pressed="false" data-i18n="nt.edit">Muokkaa</button>
    </div>

    <script src="i18n.js"></script>
    <script src="favicons.js"></script>
    <script>
        const send = (action, payload = {}) => window.ipc && window.ipc.postMessage(JSON.stringify({ action, ...payload }));
        const EN = window.viimaLang === 'en';
        const LOCALE = EN ? 'en-GB' : 'fi-FI';
        const footEl = el('div', 'foot', t('nt.footer', 'Viima v{v} • IT-Veljekset Group • Turvallinen, nopea ja kevyt', { v: '{{VERSION}}' }));

        // ---------- small helpers ----------
        function el(tag, className, text) {
            const n = document.createElement(tag);
            if (className) n.className = className;
            if (text !== undefined) n.textContent = text;
            return n;
        }
        const storageGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
        const storageSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        const fmtTemp = (x) => `${Math.round(x)}°`.replace('-', '−');
        const timeHM = (d) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

        // ---------- wallpaper (unchanged behaviour) ----------
        const WALLPAPERS = {
            'aurora-dark': { url: '/wallpapers/aurora-dark.jpg', tone: 'dark' },
            'glass-waves': { url: '/wallpapers/glass-waves.jpg', tone: 'dark' },
            'nordic-light': { url: '/wallpapers/nordic-light.jpg', tone: 'light' },
        };
        const bgEl = document.getElementById('bgWallpaper');
        const wpMenu = document.getElementById('wallpaperMenu');
        const savedWallpaper = () => storageGet('viima_newtab_wallpaper') || 'auto';
        function applyWallpaper(choice) {
            const theme = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
            const key = choice === 'auto' ? (theme === 'light' ? 'nordic-light' : 'aurora-dark') : choice;
            const entry = WALLPAPERS[key];
            if (entry) {
                bgEl.style.backgroundImage = `url('${entry.url}')`;
                bgEl.classList.add('visible');
                document.body.dataset.bgTone = entry.tone;
            } else {
                bgEl.style.backgroundImage = '';
                bgEl.classList.remove('visible');
                delete document.body.dataset.bgTone;
            }
            wpMenu.querySelectorAll('.menu-opt').forEach(o => o.classList.toggle('active', o.dataset.wallpaper === choice));
        }
        document.getElementById('wallpaperBtn').addEventListener('click', (e) => { e.stopPropagation(); addMenu.classList.remove('open'); wpMenu.classList.toggle('open'); });
        wpMenu.addEventListener('click', (e) => {
            const b = e.target.closest('.menu-opt');
            if (!b) return;
            storageSet('viima_newtab_wallpaper', b.dataset.wallpaper);
            applyWallpaper(b.dataset.wallpaper);
            wpMenu.classList.remove('open');
        });
        new MutationObserver(() => { if (savedWallpaper() === 'auto') applyWallpaper('auto'); })
            .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

        // ---------- data requests (Rust fetches; this page has no network access) ----------
        const pending = new Map();
        function ask(kind, params) {
            return new Promise((resolve, reject) => {
                const key = kind + uid();
                const timer = setTimeout(() => { pending.delete(key); reject(new Error('timeout')); }, 20000);
                pending.set(key, { resolve, reject, timer });
                send('widget_fetch', { kind, key, params });
            });
        }
        window.onWidgetData = function (kind, key, ok, payload) {
            const p = pending.get(key);
            if (!p) return;
            pending.delete(key);
            clearTimeout(p.timer);
            if (!ok) return p.reject(new Error(payload));
            try { p.resolve(JSON.parse(payload)); } catch (e) { p.reject(e); }
        };
        // Last good answer, so a reopened tab paints at once and refreshes behind it.
        const cacheGet = (k) => { try { return JSON.parse(storageGet('viima_nt_cache_' + k)); } catch { return null; } };
        const cacheSet = (k, data) => storageSet('viima_nt_cache_' + k, JSON.stringify({ at: Date.now(), data }));

        // ---------- clock ----------
        const DAYS_FI = ['sunnuntai', 'maanantai', 'tiistai', 'keskiviikko', 'torstai', 'perjantai', 'lauantai'];
        const MONTHS_FI = ['tammikuuta', 'helmikuuta', 'maaliskuuta', 'huhtikuuta', 'toukokuuta', 'kesäkuuta', 'heinäkuuta', 'elokuuta', 'syyskuuta', 'lokakuuta', 'marraskuuta', 'joulukuuta'];
        const clocks = new Set();
        let timers = [];

        function dateText(now) {
            if (EN) return now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            const d = DAYS_FI[now.getDay()];
            return `${d.charAt(0).toUpperCase() + d.slice(1)} ${now.getDate()}. ${MONTHS_FI[now.getMonth()]} ${now.getFullYear()}`;
        }
        function greetingText(hour) {
            if (hour >= 5 && hour < 10) return t('nt.morning', 'Hyvää huomenta!');
            if (hour >= 10 && hour < 17) return t('nt.day', 'Mukavaa päivää!');
            if (hour >= 17 && hour < 23) return t('nt.evening', 'Hyvää iltaa!');
            return t('nt.night', 'Rauhallista yötä!');
        }
        const SVG = 'http://www.w3.org/2000/svg';
        function analogClock() {
            const svg = document.createElementNS(SVG, 'svg');
            svg.setAttribute('viewBox', '-100 -100 200 200');
            svg.setAttribute('class', 'analog');
            const add = (tag, attrs) => {
                const n = document.createElementNS(SVG, tag);
                for (const k in attrs) n.setAttribute(k, attrs[k]);
                svg.appendChild(n);
                return n;
            };
            add('circle', { r: 96, fill: 'none', stroke: 'currentColor', 'stroke-width': 1.5 });
            for (let i = 0; i < 60; i++) {
                const major = i % 5 === 0;
                add('line', { y1: -90, y2: major ? -78 : -85, stroke: 'currentColor', 'stroke-width': major ? 2.5 : 1, transform: `rotate(${i * 6})` });
            }
            const hands = {
                h: add('line', { y2: -50, stroke: 'currentColor', 'stroke-width': 5, 'stroke-linecap': 'butt' }),
                m: add('line', { y2: -76, stroke: 'currentColor', 'stroke-width': 3, 'stroke-linecap': 'butt' }),
                s: add('line', { y1: 14, y2: -84, stroke: 'var(--accent)', 'stroke-width': 1.5 }),
            };
            add('circle', { r: 3.5, fill: 'var(--accent)' });
            svg.update = (now, withSeconds) => {
                const s = now.getSeconds(), m = now.getMinutes() + s / 60, h = (now.getHours() % 12) + m / 60;
                hands.h.setAttribute('transform', `rotate(${h * 30})`);
                hands.m.setAttribute('transform', `rotate(${m * 6})`);
                hands.s.setAttribute('transform', `rotate(${s * 6})`);
                hands.s.style.display = withSeconds ? '' : 'none';
            };
            return svg;
        }

        // ---------- weather ----------
        // WMO weather codes -> [fi, en]
        const WMO = {
            0: ['Selkeää', 'Clear'], 1: ['Melko selkeää', 'Mostly clear'], 2: ['Puolipilvistä', 'Partly cloudy'], 3: ['Pilvistä', 'Overcast'],
            45: ['Sumua', 'Fog'], 48: ['Huurtavaa sumua', 'Rime fog'],
            51: ['Heikkoa tihkua', 'Light drizzle'], 53: ['Tihkua', 'Drizzle'], 55: ['Tihkusadetta', 'Heavy drizzle'],
            56: ['Jäätävää tihkua', 'Freezing drizzle'], 57: ['Jäätävää tihkua', 'Freezing drizzle'],
            61: ['Heikkoa sadetta', 'Light rain'], 63: ['Sadetta', 'Rain'], 65: ['Runsasta sadetta', 'Heavy rain'],
            66: ['Jäätävää sadetta', 'Freezing rain'], 67: ['Jäätävää sadetta', 'Freezing rain'],
            71: ['Heikkoa lumisadetta', 'Light snow'], 73: ['Lumisadetta', 'Snow'], 75: ['Runsasta lumisadetta', 'Heavy snow'], 77: ['Lumijyväsiä', 'Snow grains'],
            80: ['Sadekuuroja', 'Showers'], 81: ['Sadekuuroja', 'Showers'], 82: ['Rankkoja kuuroja', 'Violent showers'],
            85: ['Lumikuuroja', 'Snow showers'], 86: ['Lumikuuroja', 'Snow showers'],
            95: ['Ukkosta', 'Thunderstorm'], 96: ['Ukkosta ja rakeita', 'Thunderstorm, hail'], 99: ['Ukkosta ja rakeita', 'Thunderstorm, hail'],
        };
        const wmo = (code) => (WMO[code] || ['—', '—'])[EN ? 1 : 0];

        // ---------- quotes ----------
        const CURRENCY = { EUR: '€', USD: '$', GBP: '£', SEK: 'kr', JPY: '¥' };
        const SYMBOL_RE = /^[A-Za-z0-9.^=-]{1,20}$/;
        function parseQuote(json) {
            const m = json && json.chart && json.chart.result && json.chart.result[0] && json.chart.result[0].meta;
            if (!m || typeof m.regularMarketPrice !== 'number') throw new Error('no data');
            const prev = typeof m.chartPreviousClose === 'number' ? m.chartPreviousClose : m.previousClose;
            const pct = typeof prev === 'number' && prev ? ((m.regularMarketPrice - prev) / prev) * 100
                : (typeof m.regularMarketChangePercent === 'number' ? m.regularMarketChangePercent : null);
            return { price: m.regularMarketPrice, pct, currency: m.instrumentType === 'INDEX' ? '' : (m.currency || ''), name: m.shortName || m.longName || '' };
        }
        const fmtPrice = (p) => p.toLocaleString(LOCALE, { minimumFractionDigits: 2, maximumFractionDigits: p < 10 ? 3 : 2 });
        const fmtPct = (p) => `${p >= 0 ? '+' : '−'}${Math.abs(p).toFixed(2).replace('.', EN ? '.' : ',')} %`;

        // ---------- bookmarks as shortcuts ----------
        let bookmarks = [];
        const DEFAULT_SHORTCUTS = [
            { title: 'Yle Uutiset', url: 'https://yle.fi/uutiset' },
            { title: 'YouTube', url: 'https://www.youtube.com' },
            { title: 'GitHub', url: 'https://github.com' },
            { title: 'DuckDuckGo', url: 'https://duckduckgo.com' },
            { title: 'Rust Lang', url: 'https://www.rust-lang.org' },
            { title: 'Wikipedia', url: 'https://fi.wikipedia.org' },
            { title: 'Ilmatieteen laitos', url: 'https://www.ilmatieteenlaitos.fi/saa' },
            { title: 'ChatGPT', url: 'https://chatgpt.com' },
        ];
        function getDomain(raw) {
            try { return new URL(raw).hostname.replace(/^www\./, ''); } catch { return String(raw || ''); }
        }

        // ---------- widget definitions ----------
        // mount(w, body): fills the panel body. options(w, box, changed): builds the option fields.
        const field = (label, control) => { const f = el('label', 'field'); f.append(el('span', '', label), control); return f; };
        function selectCtl(choices, value, onChange) {
            const s = el('select');
            for (const [v, label] of choices) s.appendChild(Object.assign(el('option', '', label), { value: String(v) }));
            s.value = String(value);
            s.addEventListener('change', () => onChange(s.value));
            return s;
        }
        function checkCtl(value, onChange) {
            const c = el('input');
            c.type = 'checkbox';
            c.checked = Boolean(value);
            c.addEventListener('change', () => onChange(c.checked));
            return c;
        }

        let focusedSearch = false;
        const CLOCK_DEFAULTS = { style: 'digital', hour12: false, seconds: true, date: true, greeting: true, font: 'thin', size: 'xl', color: '', align: 'left' };

        const TYPES = {
            search: {
                label: () => t('nt.w_search', 'Haku'),
                spans: [6, 8, 12],
                defaults: () => ({}),
                mount(w, body) {
                    const form = el('form', 'search-form');
                    const input = el('input', 'search-input');
                    input.type = 'text';
                    input.placeholder = t('nt.search', 'Hae verkosta tai kirjoita osoite...');
                    input.autocomplete = 'off';
                    input.spellcheck = false;
                    const go = el('span', 'search-go', 'ENTER');
                    form.append(input, go);
                    form.addEventListener('submit', (e) => {
                        e.preventDefault();
                        const q = input.value.trim();
                        if (q) send('navigate', { url: q });
                    });
                    body.appendChild(form);
                    // Typing starts right away on a fresh tab, but a re-render must not steal focus.
                    if (!focusedSearch) { focusedSearch = true; setTimeout(() => input.focus(), 0); }
                },
                options() {},
            },

            clock: {
                label: () => t('nt.w_clock', 'Kello'),
                spans: [3, 4, 5, 6, 8, 12],
                defaults: () => ({ ...CLOCK_DEFAULTS }),
                mount(w, body) {
                    const o = { ...CLOCK_DEFAULTS, ...w.opts };
                    const root = el('div', 'clock');
                    root.dataset.size = o.size;
                    root.dataset.align = o.align;
                    if (/^#[0-9a-f]{6}$/i.test(o.color)) root.style.setProperty('--clock-color', o.color);
                    const time = el('div', 'clock-time');
                    time.dataset.font = o.font;
                    const analog = o.style === 'analog' ? analogClock() : null;
                    const date = el('div', 'clock-date');
                    const greet = el('div', 'clock-greet');
                    root.append(analog || time);
                    if (o.date) root.appendChild(date);
                    if (o.greeting) root.appendChild(greet);
                    body.appendChild(root);
                    clocks.add((now) => {
                        if (analog) {
                            analog.update(now, o.seconds);
                        } else {
                            let h = now.getHours();
                            let suffix = '';
                            if (o.hour12) { suffix = h < 12 ? ' AM' : ' PM'; h = h % 12 || 12; }
                            const hh = o.hour12 ? String(h) : String(h).padStart(2, '0');
                            time.textContent = `${hh}:${String(now.getMinutes()).padStart(2, '0')}${o.seconds ? ':' + String(now.getSeconds()).padStart(2, '0') : ''}${suffix}`;
                        }
                        date.textContent = dateText(now);
                        greet.textContent = greetingText(now.getHours());
                    });
                },
                options(w, box, changed) {
                    const o = w.opts = { ...CLOCK_DEFAULTS, ...w.opts };
                    const set = (k) => (v) => { o[k] = v; changed(); };
                    box.append(
                        field(t('nt.o_style', 'Ulkoasu'), selectCtl([['digital', t('nt.o_digital', 'Digitaalinen')], ['analog', t('nt.o_analog', 'Analoginen')]], o.style, set('style'))),
                        field(t('nt.o_font', 'Fontti'), selectCtl([['thin', t('nt.o_thin', 'Ohut')], ['normal', t('nt.o_normal', 'Normaali')], ['bold', t('nt.o_bold', 'Lihava')], ['mono', t('nt.o_mono', 'Tasalevyinen')]], o.font, set('font'))),
                        field(t('nt.o_size', 'Koko'), selectCtl([['s', 'S'], ['m', 'M'], ['l', 'L'], ['xl', 'XL']], o.size, set('size'))),
                        field(t('nt.o_align', 'Tasaus'), selectCtl([['left', t('nt.o_left', 'Vasen')], ['center', t('nt.o_center', 'Keskellä')]], o.align, set('align'))),
                        field(t('nt.o_24h', '24 tunnin kello'), checkCtl(!o.hour12, (v) => set('hour12')(!v))),
                        field(t('nt.o_seconds', 'Sekunnit'), checkCtl(o.seconds, set('seconds'))),
                        field(t('nt.o_date', 'Päivämäärä'), checkCtl(o.date, set('date'))),
                        field(t('nt.o_greeting', 'Tervehdys'), checkCtl(o.greeting, set('greeting'))),
                    );
                    const color = el('input');
                    color.type = 'color';
                    color.value = /^#[0-9a-f]{6}$/i.test(o.color) ? o.color : '#ecebe6';
                    color.addEventListener('change', () => set('color')(color.value));
                    const auto = el('button', 'btn', t('nt.o_auto', 'Auto'));
                    auto.type = 'button';
                    auto.addEventListener('click', () => set('color')(''));
                    const row = el('span');
                    row.style.cssText = 'display:flex;gap:8px;align-items:center';
                    row.append(color, auto);
                    box.appendChild(field(t('nt.o_color', 'Väri'), row));
                },
            },

            weather: {
                label: () => t('nt.w_weather', 'Sää'),
                spans: [3, 4, 5, 6, 8, 12],
                defaults: () => ({ place: { name: 'Helsinki', lat: 60.1699, lon: 24.9384 } }),
                headLabel: (w) => `${t('nt.w_weather', 'Sää')} · ${w.opts.place ? w.opts.place.name : '—'}`,
                mount(w, body) {
                    const place = w.opts.place;
                    if (!place) { body.appendChild(el('div', 'muted', t('nt.wx_none', 'Valitse paikkakunta asetuksista.'))); return; }
                    const cacheKey = `wx_${place.lat}_${place.lon}`;
                    const draw = (data, stale) => {
                        const c = data.current, d = data.daily;
                        const now = el('div', 'wx-now' + (stale ? ' stale' : ''));
                        now.append(el('div', 'wx-temp', fmtTemp(c.temperature_2m)), el('div', 'wx-cond', wmo(c.weather_code)));
                        const sub = el('div', 'wx-sub' + (stale ? ' stale' : ''),
                            `${t('nt.wx_feels', 'tuntuu')} ${fmtTemp(c.apparent_temperature)} · ${t('nt.wx_wind', 'tuuli')} ${Math.round(c.wind_speed_10m)} m/s`);
                        const days = el('div', 'wx-days' + (stale ? ' stale' : ''));
                        for (let i = 1; i <= 3 && i < d.time.length; i++) {
                            const day = el('div', 'wx-day');
                            const name = new Date(d.time[i] + 'T12:00').toLocaleDateString(LOCALE, { weekday: 'short' });
                            day.append(el('b', '', name), el('span', 'range', `${fmtTemp(d.temperature_2m_max[i])} / ${fmtTemp(d.temperature_2m_min[i])}`), el('span', 'what', wmo(d.weather_code[i])));
                            days.appendChild(day);
                        }
                        body.replaceChildren(now, sub, days);
                    };
                    const cached = cacheGet(cacheKey);
                    if (cached) draw(cached.data, true);
                    else body.appendChild(el('div', 'muted', t('nt.loading', 'Ladataan…')));
                    const load = () => ask('weather', { lat: place.lat, lon: place.lon }).then((data) => {
                        cacheSet(cacheKey, data);
                        draw(data, false);
                    }).catch(() => {
                        if (!cached) body.replaceChildren(el('div', 'muted', t('nt.offline', 'Tietoja ei saatu. Tarkista verkkoyhteys.')));
                    });
                    load();
                    timers.push(setInterval(load, 15 * 60 * 1000));
                },
                options(w, box, changed) {
                    const input = el('input');
                    input.type = 'text';
                    input.placeholder = t('nt.wx_search', 'Paikkakunta');
                    const results = el('div', 'results');
                    const go = el('button', 'btn', t('nt.wx_find', 'Hae'));
                    go.type = 'button';
                    const find = () => {
                        const q = input.value.trim();
                        if (q.length < 2) return;
                        results.replaceChildren(el('div', 'muted', t('nt.loading', 'Ladataan…')));
                        ask('geocode', { q }).then((r) => {
                            const list = (r && r.results) || [];
                            if (!list.length) { results.replaceChildren(el('div', 'muted', t('nt.wx_notfound', 'Paikkaa ei löytynyt.'))); return; }
                            results.replaceChildren(...list.map((p) => {
                                const b = el('button', 'btn', [p.name, p.admin1, p.country].filter(Boolean).join(', '));
                                b.type = 'button';
                                b.addEventListener('click', () => { w.opts.place = { name: p.name, lat: p.latitude, lon: p.longitude }; changed(true); });
                                return b;
                            }));
                        }).catch(() => results.replaceChildren(el('div', 'muted', t('nt.offline', 'Tietoja ei saatu. Tarkista verkkoyhteys.'))));
                    };
                    go.addEventListener('click', find);
                    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); find(); } });
                    const row = el('span');
                    row.style.cssText = 'display:flex;gap:8px';
                    row.append(input, go);
                    box.append(field(t('nt.wx_place', 'Paikkakunta'), row), results, el('div', 'muted', t('nt.wx_credit', 'Säätiedot: Open-Meteo')));
                },
            },

            stocks: {
                label: () => t('nt.w_stocks', 'Pörssikurssit'),
                spans: [3, 4, 5, 6, 8, 12],
                defaults: () => ({ symbols: ['^OMXH25', 'NOKIA.HE', '^GSPC', 'BTC-EUR'] }),
                mount(w, body) {
                    const symbols = (w.opts.symbols || []).filter((s) => SYMBOL_RE.test(s));
                    if (!symbols.length) { body.appendChild(el('div', 'muted', t('nt.q_none', 'Lisää seurattavia kursseja asetuksista.'))); return; }
                    const table = el('table', 'quotes');
                    const rows = {};
                    for (const s of symbols) {
                        const tr = el('tr');
                        const name = el('td');
                        name.append(el('span', 'q-sym', s), el('span', 'q-name', ''));
                        tr.append(name, el('td', 'q-price', '…'), el('td', 'q-chg', ''));
                        table.appendChild(tr);
                        rows[s] = tr;
                    }
                    body.appendChild(table);
                    const paint = (s, q, stale) => {
                        const tr = rows[s];
                        tr.classList.toggle('stale', stale);
                        tr.querySelector('.q-name').textContent = q.name;
                        tr.querySelector('.q-price').textContent = `${fmtPrice(q.price)}${q.currency ? ' ' + (CURRENCY[q.currency] || q.currency) : ''}`;
                        const chg = tr.querySelector('.q-chg');
                        chg.textContent = q.pct === null ? '' : fmtPct(q.pct);
                        chg.className = 'q-chg ' + (q.pct === null ? '' : q.pct >= 0 ? 'up' : 'down');
                    };
                    const load = () => symbols.forEach((s) => {
                        const cached = cacheGet('q_' + s);
                        if (cached && !rows[s].dataset.fresh) paint(s, cached.data, true);
                        ask('quote', { symbol: s }).then((json) => {
                            const q = parseQuote(json);
                            cacheSet('q_' + s, q);
                            rows[s].dataset.fresh = '1';
                            paint(s, q, false);
                        }).catch(() => {
                            if (!rows[s].dataset.fresh && !cached) rows[s].querySelector('.q-price').textContent = t('nt.q_fail', 'ei tietoja');
                        });
                    });
                    load();
                    timers.push(setInterval(load, 5 * 60 * 1000));
                },
                options(w, box, changed) {
                    const list = el('div', 'results');
                    const syms = w.opts.symbols = (w.opts.symbols || []).slice();
                    for (const s of syms) {
                        const row = el('div', 'field');
                        const rm = el('button', 'btn', '×');
                        rm.type = 'button';
                        rm.title = t('nt.remove', 'Poista');
                        rm.addEventListener('click', () => { w.opts.symbols = syms.filter((x) => x !== s); changed(true); });
                        row.append(el('span', 'q-sym', s), rm);
                        list.appendChild(row);
                    }
                    const input = el('input');
                    input.type = 'text';
                    input.placeholder = 'NOKIA.HE';
                    const add = () => {
                        const s = input.value.trim().toUpperCase();
                        if (!SYMBOL_RE.test(s) || syms.includes(s) || syms.length >= 12) return;
                        w.opts.symbols = [...syms, s];
                        changed(true);
                    };
                    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
                    const addBtn = el('button', 'btn', t('nt.add_short', 'Lisää'));
                    addBtn.type = 'button';
                    addBtn.addEventListener('click', add);
                    const row = el('span');
                    row.style.cssText = 'display:flex;gap:8px';
                    row.append(input, addBtn);
                    box.append(list, field(t('nt.q_symbol', 'Tunnus'), row),
                        el('div', 'muted', t('nt.q_hint', 'Yahoo Financen tunnus, esim. NOKIA.HE, AAPL, ^GSPC, BTC-EUR. Kurssit voivat olla viivästettyjä.')));
                },
            },

            shortcuts: {
                label: () => t('nt.w_shortcuts', 'Pikalinkit'),
                spans: [4, 6, 8, 12],
                defaults: () => ({ count: 8 }),
                headLabel: () => t('nt.w_shortcuts', 'Pikalinkit'),
                mount(w, body) {
                    const count = Number(w.opts.count) || 8;
                    const items = (bookmarks.length ? bookmarks : DEFAULT_SHORTCUTS).slice(0, count);
                    viimaFavicons.want(items.map((i) => i.url));
                    const grid = el('div', 'tiles');
                    for (const item of items) {
                        const a = el('a', 'tile');
                        const url = item.url || '';
                        if (/^https?:\/\//i.test(url)) a.href = url; // never a javascript: link on this privileged page
                        const domain = getDomain(url);
                        const title = (item.title || domain || '?').trim();
                        a.title = `${title} • ${url}`;
                        const icon = el('span', 'tile-icon');
                        const src = viimaFavicons.get(url);
                        if (src) icon.appendChild(Object.assign(el('img'), { src, alt: '' }));
                        else icon.textContent = title.charAt(0).toUpperCase();
                        const text = el('span', 'tile-text');
                        text.append(el('span', 'tile-title', title), el('span', 'tile-desc', domain));
                        a.append(icon, text);
                        grid.appendChild(a);
                    }
                    body.appendChild(grid);
                },
                options(w, box, changed) {
                    box.append(
                        field(t('nt.o_count', 'Linkkien määrä'), selectCtl([4, 8, 12, 16, 24].map((n) => [n, String(n)]), w.opts.count || 8, (v) => { w.opts.count = Number(v); changed(); })),
                        el('div', 'muted', t('nt.o_bm_hint', 'Linkit tulevat kirjanmerkeistäsi.')),
                    );
                },
            },
        };

        // ---------- layout state ----------
        const LAYOUT_KEY = 'viima_newtab_layout';
        function defaultLayout() {
            const mk = (type, span) => ({ id: uid(), type, span, opts: TYPES[type].defaults() });
            return { v: 1, widgets: [mk('search', 12), mk('clock', 5), mk('weather', 3), mk('stocks', 4), mk('shortcuts', 12)] };
        }
        function loadLayout() {
            try {
                const l = JSON.parse(storageGet(LAYOUT_KEY));
                if (l && l.v === 1 && Array.isArray(l.widgets)) {
                    l.widgets = l.widgets.filter((w) => w && TYPES[w.type]).map((w) => ({ id: String(w.id || uid()), type: w.type, span: Number(w.span) || 4, opts: w.opts && typeof w.opts === 'object' ? w.opts : {} }));
                    return l;
                }
            } catch {}
            return defaultLayout();
        }
        let layout = loadLayout();
        const saveLayout = () => storageSet(LAYOUT_KEY, JSON.stringify(layout));
        let editing = false;
        const openOpts = new Set();

        // ---------- render ----------
        const boardEl = document.getElementById('board');
        function render() {
            timers.forEach(clearInterval);
            timers = [];
            clocks.clear();
            const kept = boardEl.querySelector('.private-note');
            boardEl.replaceChildren(kept);
            layout.widgets.forEach((w, i) => {
                const type = TYPES[w.type];
                const panel = el('section', 'w' + (openOpts.has(w.id) ? ' open' : ''));
                panel.dataset.type = w.type;
                panel.style.setProperty('--span', w.span);
                panel.style.setProperty('--i', i);
                const head = el('div', 'w-head');
                head.appendChild(el('span', 'label', type.headLabel ? type.headLabel(w) : type.label()));
                const tools = el('div', 'w-tools');
                const tool = (text, title, fn, pressed) => {
                    const b = el('button', 'tool', text);
                    b.type = 'button';
                    b.title = title;
                    if (pressed !== undefined) b.setAttribute('aria-pressed', String(pressed));
                    b.addEventListener('click', fn);
                    return b;
                };
                const move = (d) => () => {
                    const j = i + d;
                    if (j < 0 || j >= layout.widgets.length) return;
                    [layout.widgets[i], layout.widgets[j]] = [layout.widgets[j], layout.widgets[i]];
                    saveLayout();
                    render();
                };
                const spanSel = selectCtl(type.spans.map((n) => [n, `${n}/12`]), type.spans.includes(w.span) ? w.span : type.spans[0], (v) => { w.span = Number(v); saveLayout(); render(); });
                spanSel.className = 'tool';
                spanSel.title = t('nt.width', 'Leveys');
                tools.append(spanSel, tool('←', t('nt.move_left', 'Siirrä aiemmaksi'), move(-1)), tool('→', t('nt.move_right', 'Siirrä myöhemmäksi'), move(1)));
                if (w.type !== 'search') {
                    tools.appendChild(tool('⚙', t('nt.options', 'Asetukset'), () => {
                        if (openOpts.has(w.id)) openOpts.delete(w.id); else openOpts.add(w.id);
                        panel.classList.toggle('open');
                    }, openOpts.has(w.id)));
                }
                tools.appendChild(tool('×', t('nt.remove', 'Poista'), () => {
                    layout.widgets.splice(i, 1);
                    openOpts.delete(w.id);
                    saveLayout();
                    render();
                }));
                head.appendChild(tools);
                const body = el('div', 'w-body');
                panel.append(head, body);
                if (w.type !== 'search') {
                    const box = el('div', 'opts');
                    type.options(w, box, () => { saveLayout(); render(); });
                    panel.appendChild(box);
                }
                boardEl.appendChild(panel);
                type.mount(w, body);
            });
            boardEl.appendChild(footEl);
            updateClocks();
        }
        function updateClocks() {
            const now = new Date();
            clocks.forEach((fn) => fn(now));
        }
        setInterval(updateClocks, 1000);

        // ---------- edit mode ----------
        const btnEdit = document.getElementById('btnEdit');
        const addMenu = document.getElementById('addMenu');
        btnEdit.addEventListener('click', () => {
            editing = !editing;
            document.body.classList.toggle('editing', editing);
            btnEdit.setAttribute('aria-pressed', String(editing));
            btnEdit.textContent = editing ? t('nt.done', 'Valmis') : t('nt.edit', 'Muokkaa');
            addMenu.classList.remove('open');
        });
        document.getElementById('btnAdd').addEventListener('click', (e) => {
            e.stopPropagation();
            wpMenu.classList.remove('open');
            const hasSearch = layout.widgets.some((w) => w.type === 'search');
            addMenu.replaceChildren(el('div', 'menu-title', t('nt.add_title', 'Lisää widget')));
            for (const [type, def] of Object.entries(TYPES)) {
                if (type === 'search' && hasSearch) continue;
                const b = el('button', 'menu-opt', def.label());
                b.type = 'button';
                b.addEventListener('click', () => {
                    const w = { id: uid(), type, span: def.spans.includes(4) ? 4 : def.spans[0], opts: def.defaults() };
                    layout.widgets.push(w);
                    if (type !== 'search') openOpts.add(w.id);
                    saveLayout();
                    render();
                    addMenu.classList.remove('open');
                });
                addMenu.appendChild(b);
            }
            addMenu.classList.toggle('open');
        });
        const btnReset = document.getElementById('btnReset');
        let resetArmed = null;
        btnReset.addEventListener('click', () => {
            if (!resetArmed) {
                btnReset.textContent = t('nt.reset_sure', 'Varmista: palauta');
                resetArmed = setTimeout(() => { resetArmed = null; btnReset.textContent = t('nt.reset', 'Palauta oletukset'); }, 3000);
                return;
            }
            clearTimeout(resetArmed);
            resetArmed = null;
            btnReset.textContent = t('nt.reset', 'Palauta oletukset');
            layout = defaultLayout();
            openOpts.clear();
            saveLayout();
            render();
        });
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.menu-wrap')) { wpMenu.classList.remove('open'); addMenu.classList.remove('open'); }
        });

        // ---------- browser state ----------
        window.onBrowserStateUpdate = function (state) {
            if (!state) return;
            if (state.settings) document.documentElement.dataset.theme = state.settings.dark_mode ? 'dark' : 'light';
            if (Array.isArray(state.bookmarks)) {
                const before = JSON.stringify(bookmarks.map((b) => [b.url, b.title]));
                bookmarks = state.bookmarks;
                storageSet('viima_cached_bookmarks', JSON.stringify(bookmarks));
                if (before !== JSON.stringify(bookmarks.map((b) => [b.url, b.title])) && !editing) render();
            }
        };
        viimaFavicons.onUpdate(() => { if (!editing) render(); });

        try { bookmarks = JSON.parse(storageGet('viima_cached_bookmarks')) || []; } catch { bookmarks = []; }
        applyWallpaper(savedWallpaper());
        render();
        send('request_initial_state');
    </script>
</body>
</html>
