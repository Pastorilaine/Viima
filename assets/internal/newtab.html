<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uusi välilehti — Viima</title>
    <link rel="icon" type="image/png" href="viima-logo.png">
    <style>
        :root {
            --bg-page: #0f1117;
            --bg-card: rgba(26, 29, 38, 0.75);
            --bg-card-hover: rgba(37, 41, 54, 0.95);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --border-card: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(56, 189, 248, 0.5);
            --bg-glow: #181d2a;
            --bg-card-focus: rgba(30, 34, 46, 0.95);
            --clock-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-sm: 0 4px 15px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 8px 25px rgba(0, 0, 0, 0.35);
            --shadow-lg: 0 10px 35px rgba(0, 0, 0, 0.45);
            color-scheme: dark;
        }

        :root[data-theme="light"] {
            --bg-page: #eef1f6;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-hover: #ffffff;
            --text-main: #0f172a;
            --text-dim: #52607a;
            --accent: #0284c7;
            --accent-glow: rgba(2, 132, 199, 0.25);
            --border-card: rgba(15, 23, 42, 0.1);
            --border-hover: rgba(2, 132, 199, 0.5);
            --bg-glow: #ffffff;
            --bg-card-focus: #ffffff;
            --clock-shadow: none;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.07);
            --shadow-md: 0 8px 22px rgba(15, 23, 42, 0.13);
            --shadow-lg: 0 10px 30px rgba(15, 23, 42, 0.16);
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 15%, var(--bg-glow) 0%, var(--bg-page) 75%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            user-select: none;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Wallpaper Layer + Contrast Scrim */
        .bg-wallpaper {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }

        .bg-wallpaper.visible {
            opacity: 1;
        }

        .bg-scrim {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.35s ease, background 0.35s ease;
        }

        body[data-bg-tone="dark"] .bg-scrim {
            opacity: 1;
            background: radial-gradient(circle at 50% 35%, rgba(11, 14, 23, 0.28) 0%, rgba(11, 14, 23, 0.62) 100%);
        }

        body[data-bg-tone="light"] .bg-scrim {
            opacity: 1;
            background: radial-gradient(circle at 50% 35%, rgba(244, 247, 252, 0.32) 0%, rgba(226, 234, 245, 0.58) 100%);
        }

        body[data-bg-tone="dark"] .clock-time,
        body[data-bg-tone="dark"] .greeting {
            color: #f8fafc;
            text-shadow: 0 3px 18px rgba(0, 0, 0, 0.55);
        }

        body[data-bg-tone="dark"] .clock-date,
        body[data-bg-tone="dark"] .footer {
            color: rgba(226, 232, 240, 0.85);
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);
        }

        body[data-bg-tone="light"] .clock-time,
        body[data-bg-tone="light"] .greeting {
            color: #0f172a;
            text-shadow: 0 2px 14px rgba(255, 255, 255, 0.7);
        }

        body[data-bg-tone="light"] .clock-date,
        body[data-bg-tone="light"] .footer {
            color: #334155;
            text-shadow: 0 1px 10px rgba(255, 255, 255, 0.65);
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            animation: fadeIn 0.4s ease-out;
        }

        /* Clock */
        .brand-hero {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px 6px 8px;
            border-radius: 999px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            margin-bottom: -14px;
        }

        .brand-hero-logo {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            object-fit: cover;
        }

        .brand-hero-name {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--text-main);
        }

        .clock-container {
            text-align: center;
        }

        .clock-time {
            font-size: 68px;
            font-weight: 200;
            letter-spacing: -0.04em;
            color: var(--text-main);
            text-shadow: var(--clock-shadow);
        }

        .clock-date {
            font-size: 16px;
            color: var(--text-dim);
            font-weight: 400;
            margin-top: -4px;
        }

        .greeting {
            font-size: 20px;
            font-weight: 500;
            color: var(--text-main);
            margin-top: 8px;
        }

        /* Search Box */
        .search-box-wrapper {
            width: 100%;
            max-width: 620px;
            position: relative;
        }

        .search-form {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 6px 18px;
            box-shadow: var(--shadow-md);
            transition: all 0.2s ease;
        }

        .search-form:focus-within {
            border-color: var(--border-hover);
            box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow-lg);
            background: var(--bg-card-focus);
        }

        .search-icon {
            font-size: 16px;
            color: var(--text-dim);
            margin-right: 12px;
            display: flex;
            align-items: center;
        }

        .search-input {
            flex: 1;
            height: 44px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 16px;
            user-select: text;
        }

        .search-input::placeholder {
            color: var(--text-dim);
        }

        /* Shortcuts Grid */
        .shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            width: 100%;
            margin-top: 6px;
        }

        @media (max-width: 768px) {
            .shortcuts-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .shortcut-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            min-width: 0;
        }

        .shortcut-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .shortcut-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .shortcut-text {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
            flex: 1;
        }

        .shortcut-title {
            font-size: 13.5px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .shortcut-desc {
            font-size: 11px;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            width: 100%;
            margin-top: 6px;
        }

        @media (max-width: 768px) {
            .shortcuts-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .shortcut-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
        }

        .shortcut-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .shortcut-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .shortcut-text {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .shortcut-title {
            font-size: 13.5px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .shortcut-desc {
            font-size: 11px;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-dim);
            text-align: center;
            opacity: 0.65;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Wallpaper Switcher */
        .wallpaper-picker {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 10;
        }

        .wallpaper-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 13px;
            border-radius: 999px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            backdrop-filter: blur(12px);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        .wallpaper-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .wallpaper-menu {
            position: absolute;
            right: 0;
            bottom: 44px;
            width: 244px;
            padding: 8px;
            border-radius: 14px;
            background: var(--bg-card-focus);
            border: 1px solid var(--border-card);
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow-lg);
            display: none;
            flex-direction: column;
            gap: 4px;
        }

        .wallpaper-menu.open {
            display: flex;
            animation: fadeIn 0.15s ease-out;
        }

        .wallpaper-menu-title {
            padding: 4px 8px 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
        }

        .wallpaper-opt {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 6px 8px;
            border: 1px solid transparent;
            border-radius: 9px;
            background: transparent;
            color: var(--text-main);
            font-size: 12.5px;
            text-align: left;
            cursor: pointer;
            transition: background 0.12s ease, border-color 0.12s ease;
        }

        .wallpaper-opt:hover {
            background: var(--bg-card-hover);
        }

        .wallpaper-opt.active {
            border-color: var(--border-hover);
            background: var(--bg-card);
        }

        .wallpaper-thumb {
            width: 36px;
            height: 22px;
            border-radius: 5px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border-card);
        }

        .wallpaper-thumb-auto {
            background: linear-gradient(135deg, #0b192c 50%, #dce7f5 50%);
        }

        .wallpaper-thumb-none {
            background: radial-gradient(circle at 50% 25%, var(--bg-glow), var(--bg-page));
        }
    </style>
</head>
<body>
    <div class="bg-wallpaper" id="bgWallpaper" aria-hidden="true"></div>
    <div class="bg-scrim" aria-hidden="true"></div>
    <div class="container">
        <!-- Brand Badge -->
        <div class="brand-hero">
            <img src="viima-logo.png" class="brand-hero-logo" alt="Viima">
            <span class="brand-hero-name">Viima</span>
        </div>

        <!-- Clock & Greeting -->
        <div class="clock-container">
            <div class="clock-time" id="clockTime">--:--</div>
            <div class="clock-date" id="clockDate">--</div>
            <div class="greeting" id="greetingText">Tervetuloa Viimaan</div>
        </div>

        <!-- Search Bar -->
        <div class="search-box-wrapper">
            <form class="search-form" id="searchForm">
                <span class="search-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                <input type="text" class="search-input" id="searchInput" placeholder="Hae verkosta tai kirjoita osoite..." autofocus autocomplete="off" spellcheck="false">
            </form>
        </div>

        <!-- Shortcuts Grid (Korvataan automaattisesti käyttäjän kirjanmerkeillä) -->
        <div class="shortcuts-grid" id="shortcutsGrid"></div>

        <div class="footer">
            Viima v{{VERSION}} • IT-Veljekset Group • Turvallinen, nopea ja kevyt
        </div>
    </div>

    <div class="wallpaper-picker" id="wallpaperPicker">
        <div class="wallpaper-menu" id="wallpaperMenu" role="menu">
            <div class="wallpaper-menu-title">Aloitussivun tausta</div>
            <button type="button" class="wallpaper-opt" data-wallpaper="auto">
                <span class="wallpaper-thumb wallpaper-thumb-auto"></span>
                <span>Automaattinen (Teema)</span>
            </button>
            <button type="button" class="wallpaper-opt" data-wallpaper="aurora-dark">
                <img class="wallpaper-thumb" src="/wallpapers/aurora-dark.jpg" alt="">
                <span>Revontulet (Tumma)</span>
            </button>
            <button type="button" class="wallpaper-opt" data-wallpaper="glass-waves">
                <img class="wallpaper-thumb" src="/wallpapers/glass-waves.jpg" alt="">
                <span>Lasiaallot (Tumma)</span>
            </button>
            <button type="button" class="wallpaper-opt" data-wallpaper="nordic-light">
                <img class="wallpaper-thumb" src="/wallpapers/nordic-light.jpg" alt="">
                <span>Pohjoinen aamu (Vaalea)</span>
            </button>
            <button type="button" class="wallpaper-opt" data-wallpaper="none">
                <span class="wallpaper-thumb wallpaper-thumb-none"></span>
                <span>Pelkkä liukuväri</span>
            </button>
        </div>
        <button type="button" class="wallpaper-btn" id="wallpaperBtn" title="Vaihda aloitussivun taustakuva">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span>Taustakuva</span>
        </button>
    </div>

    <script>
        // Wallpaper management
        const WALLPAPERS = {
            'aurora-dark': { url: '/wallpapers/aurora-dark.jpg', tone: 'dark' },
            'glass-waves': { url: '/wallpapers/glass-waves.jpg', tone: 'dark' },
            'nordic-light': { url: '/wallpapers/nordic-light.jpg', tone: 'light' },
        };
        const WALLPAPER_STORAGE_KEY = 'oma_selain_newtab_wallpaper';
        const bgWallpaperEl = document.getElementById('bgWallpaper');
        const wallpaperPickerEl = document.getElementById('wallpaperPicker');
        const wallpaperBtnEl = document.getElementById('wallpaperBtn');
        const wallpaperMenuEl = document.getElementById('wallpaperMenu');
        const wallpaperOpts = wallpaperMenuEl.querySelectorAll('.wallpaper-opt');

        function getSavedWallpaper() {
            try {
                return localStorage.getItem(WALLPAPER_STORAGE_KEY) || 'auto';
            } catch {
                return 'auto';
            }
        }

        function applyWallpaper(choice) {
            const theme = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
            const resolvedKey = choice === 'auto'
                ? (theme === 'light' ? 'nordic-light' : 'aurora-dark')
                : choice;
            const entry = WALLPAPERS[resolvedKey];

            if (entry) {
                bgWallpaperEl.style.backgroundImage = `url('${entry.url}')`;
                bgWallpaperEl.classList.add('visible');
                document.body.dataset.bgTone = entry.tone;
            } else {
                bgWallpaperEl.style.backgroundImage = '';
                bgWallpaperEl.classList.remove('visible');
                delete document.body.dataset.bgTone;
            }

            wallpaperOpts.forEach(opt => {
                opt.classList.toggle('active', opt.dataset.wallpaper === choice);
            });
        }

        wallpaperBtnEl.addEventListener('click', (e) => {
            e.stopPropagation();
            wallpaperMenuEl.classList.toggle('open');
        });

        wallpaperMenuEl.addEventListener('click', (e) => {
            const btn = e.target.closest('.wallpaper-opt');
            if (!btn) return;
            const choice = btn.dataset.wallpaper;
            try {
                localStorage.setItem(WALLPAPER_STORAGE_KEY, choice);
            } catch {}
            applyWallpaper(choice);
            wallpaperMenuEl.classList.remove('open');
        });

        document.addEventListener('click', (e) => {
            if (!wallpaperPickerEl.contains(e.target)) {
                wallpaperMenuEl.classList.remove('open');
            }
        });

        // React immediately when browser toggles light/dark theme via top bar
        new MutationObserver(() => {
            if (getSavedWallpaper() === 'auto') {
                applyWallpaper('auto');
            }
        }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

        applyWallpaper(getSavedWallpaper());

        // Update Live Clock & Finnish Greeting
        const days = ['sunnuntai', 'maanantai', 'tiistai', 'keskiviikko', 'torstai', 'perjantai', 'lauantai'];
        const months = ['tammikuuta', 'helmikuuta', 'maaliskuuta', 'huhtikuuta', 'toukokuuta', 'kesäkuuta', 'heinäkuuta', 'elokuuta', 'syyskuuta', 'lokakuuta', 'marraskuuta', 'joulukuuta'];
        const clockTimeEl = document.getElementById('clockTime');
        const clockDateEl = document.getElementById('clockDate');
        const greetingEl = document.getElementById('greetingText');
        let lastDateKey = '';
        let lastGreeting = '';

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            clockTimeEl.textContent = `${h}:${m}:${s}`;

            const dateKey = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
            if (dateKey !== lastDateKey) {
                lastDateKey = dateKey;
                const dayName = days[now.getDay()];
                const dayNum = now.getDate();
                const monthName = months[now.getMonth()];
                const year = now.getFullYear();
                const capitalizedDay = dayName.charAt(0).toUpperCase() + dayName.slice(1);
                clockDateEl.textContent = `${capitalizedDay}, ${dayNum}. ${monthName} ${year}`;
            }

            // Contextual Finnish Greeting
            const hour = now.getHours();
            let greeting = 'Hyvää päivää!';
            if (hour >= 5 && hour < 10) greeting = 'Hyvää huomenta!';
            else if (hour >= 10 && hour < 17) greeting = 'Mukavaa päivää!';
            else if (hour >= 17 && hour < 23) greeting = 'Hyvää iltaa!';
            else greeting = 'Rauhallista yötä!';
            if (greeting !== lastGreeting) {
                lastGreeting = greeting;
                greetingEl.textContent = greeting;
            }
        }

        updateClock();
        setInterval(updateClock, 1000);

        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');

        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const q = searchInput.value.trim();
            if (!q) return;

            if (window.ipc && window.ipc.postMessage) {
                window.ipc.postMessage(JSON.stringify({ action: 'navigate', url: q }));
            }
        });

        // Bookmarks on Start Page (replaces static shortcuts)
        const shortcutsGridEl = document.getElementById('shortcutsGrid');
        const BOOKMARKS_CACHE_KEY = 'viima_cached_bookmarks';

        const DEFAULT_SHORTCUTS = [
            { title: 'Yle Uutiset', url: 'https://yle.fi/uutiset' },
            { title: 'YouTube', url: 'https://www.youtube.com' },
            { title: 'GitHub', url: 'https://github.com' },
            { title: 'DuckDuckGo', url: 'https://duckduckgo.com' },
            { title: 'Rust Lang', url: 'https://www.rust-lang.org' },
            { title: 'Wikipedia', url: 'https://fi.wikipedia.org' },
            { title: 'Sää', url: 'https://www.ilmatieteenlaitos.fi/saa' },
            { title: 'ChatGPT', url: 'https://chatgpt.com' },
        ];

        const BRAND_COLORS = [
            'linear-gradient(135deg, #2563eb, #1d4ed8)',
            'linear-gradient(135deg, #059669, #047857)',
            'linear-gradient(135deg, #7c3aed, #6d28d9)',
            'linear-gradient(135deg, #d97706, #b45309)',
            'linear-gradient(135deg, #0284c7, #0369a1)',
            'linear-gradient(135deg, #e11d48, #be123c)',
        ];

        function hashString(str) {
            let h = 0;
            for (let i = 0; i < str.length; i++) {
                h = ((h << 5) - h) + str.charCodeAt(i);
                h |= 0;
            }
            return Math.abs(h);
        }

        function getDomain(rawUrl) {
            try {
                const u = new URL(rawUrl);
                return u.hostname.replace(/^www\./, '');
            } catch {
                return (rawUrl || '').replace(/^https?:\/\//i, '').split('/')[0];
            }
        }

        function getIconHtml(url, title) {
            const domain = getDomain(url).toLowerCase();

            if (domain.includes('iltalehti.fi')) {
                return `<div class="shortcut-icon-box" style="background: #D6001C;">
                    <svg width="34" height="26" viewBox="0 0 68 48">
                        <text x="34" y="34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">IL</text>
                    </svg>
                </div>`;
            }

            if (domain.includes('is.fi') || domain.includes('iltasanomat.fi')) {
                return `<div class="shortcut-icon-box" style="background: #111111;">
                    <svg width="34" height="26" viewBox="0 0 68 48">
                        <text x="34" y="34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="28" font-weight="900" fill="#FFDE00" text-anchor="middle">IS</text>
                    </svg>
                </div>`;
            }

            if (domain.includes('yle.fi')) {
                return `<div class="shortcut-icon-box" style="background: #00a5b5;">
                    <svg width="34" height="34" viewBox="0 0 100 100" fill="none">
                        <rect width="100" height="100" rx="20" fill="#00A5B5"/>
                        <g fill="#FFFFFF">
                            <path d="M26 36h7.5l5.2 16.5L44 36h7.2L42.8 58.5c-1.8 4.2-4.2 6.8-9 6.8h-4.2v-5.6h3.2c2.2 0 3.2-1.2 4-3.2L26 36z"/>
                            <rect x="54" y="27" width="7" height="31.5" rx="3.5"/>
                            <path d="M64 45.2c0-5.8 4.6-9.7 10.5-9.7 6.2 0 10.5 4.3 10.5 10.2v2H70.8c.4 3.8 3.2 5.8 6.8 5.8 2.6 0 4.8-.8 6.4-2.2l3.4 4c-2.4 2.4-6 3.6-10 3.6-7.8 0-13.4-5.6-13.4-13.7zm14.4-2.5c-.3-3.2-2.4-5-4.8-5-2.6 0-4.6 1.8-5.1 5h9.9z"/>
                        </g>
                    </svg>
                </div>`;
            }

            if (domain.includes('youtube.com')) {
                return `<div class="shortcut-icon-box" style="background: #280808;">
                    <svg width="36" height="26" viewBox="0 0 68 48">
                        <path fill="#FF0000" d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55c-2.93.78-4.63 3.26-5.42 6.19C.06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24s-.06-10.95-1.48-16.26z"/>
                        <polygon fill="#FFFFFF" points="27,34 45,24 27,14"/>
                    </svg>
                </div>`;
            }

            if (domain.includes('github.com')) {
                return `<div class="shortcut-icon-box" style="background: #1f2328;">
                    <svg width="30" height="30" viewBox="0 0 98 96" fill="#FFFFFF">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z"/>
                    </svg>
                </div>`;
            }

            if (domain.includes('duckduckgo.com')) {
                return `<div class="shortcut-icon-box" style="background: rgba(222, 88, 51, 0.15);">
                    <svg width="32" height="32" viewBox="0 0 48 48">
                        <circle cx="24" cy="24" r="23" fill="#DE5833"/>
                        <path fill="#FFFFFF" d="M30 14c-3.3 0-6.1 1.8-7.5 4.5-1-.6-2.3-1-3.7-1-3.6 0-6.5 2.9-6.5 6.5 0 1.2.3 2.3.9 3.3-2.3 1.9-3.7 4.8-3.7 8 0 1 .1 1.9.4 2.8 3.6 3.7 8.6 6 14.1 6 11 0 20-9 20-20 0-5.6-4.5-10.1-10-10.1z"/>
                        <ellipse cx="29" cy="19" rx="2" ry="2.5" fill="#222222"/>
                        <polygon points="26,24 17,26 23,30" fill="#EFA227"/>
                        <path fill="#34A853" d="M22 34l3-2 3 2-1-3 2-2-3-.2-1-3-1 3-3 .2 2 2z"/>
                    </svg>
                </div>`;
            }

            if (domain.includes('rust-lang.org')) {
                return `<div class="shortcut-icon-box" style="background: #2b1f1a;">
                    <svg width="32" height="32" viewBox="0 0 106 106">
                        <g fill="#F74C00">
                            <path d="M53 0C23.7 0 0 23.7 0 53s23.7 53 53 53 53-23.7 53-53S82.3 0 53 0zm0 10c23.7 0 43 19.3 43 43s-19.3 43-43 43S10 76.7 10 53 29.3 10 53 10z"/>
                            <circle cx="53" cy="24" r="6" fill="#2b1f1a"/>
                            <circle cx="25" cy="44" r="6" fill="#2b1f1a"/>
                            <circle cx="81" cy="44" r="6" fill="#2b1f1a"/>
                            <circle cx="36" cy="78" r="6" fill="#2b1f1a"/>
                            <circle cx="70" cy="78" r="6" fill="#2b1f1a"/>
                            <path fill="#FFFFFF" d="M38 32h16c8.8 0 14.5 4.8 14.5 12.4 0 5.8-3.4 10-8.8 11.6l10.8 18h-8.8L47 56.5h-2v17.5h-7V32zm7 18h8.5c4.8 0 7.8-2.4 7.8-6.2 0-4-3-6-7.8-6H45v12.2z"/>
                        </g>
                    </svg>
                </div>`;
            }

            if (domain.includes('wikipedia.org')) {
                return `<div class="shortcut-icon-box" style="background: #252830;">
                    <svg width="32" height="32" viewBox="0 0 100 100" fill="#EAECF0">
                        <g transform="translate(6, 12)">
                            <path d="M12 10 L28 66 L42 22 L56 66 L72 10 L84 10 L64 74 L50 30 L36 74 L16 10 Z" fill="#FFFFFF"/>
                            <circle cx="44" cy="74" r="2.5" fill="#38bdf8"/>
                        </g>
                    </svg>
                </div>`;
            }

            if (domain.includes('ilmatieteenlaitos.fi') || domain.includes('foreca') || domain.includes('weather') || domain.includes('saa')) {
                return `<div class="shortcut-icon-box" style="background: rgba(0, 102, 204, 0.18);">
                    <svg width="32" height="32" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="46" fill="#0066CC"/>
                        <circle cx="40" cy="40" r="14" fill="#FFCC00"/>
                        <path d="M30 64 a12 12 0 0 1 22 -6 a16 16 0 0 1 24 6 a10 10 0 0 1 -4 14 h-40 a10 10 0 0 1 -2 -14 z" fill="#FFFFFF"/>
                    </svg>
                </div>`;
            }

            if (domain.includes('chatgpt.com') || domain.includes('openai.com')) {
                return `<div class="shortcut-icon-box" style="background: #10a37f;">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a4.4 4.4 0 0 0-4.35 3.65A4.4 4.4 0 0 0 4 9.17a4.4 4.4 0 0 0 .8 5.6 4.4 4.4 0 0 0 2.85 4.88A4.4 4.4 0 0 0 12 22a4.4 4.4 0 0 0 4.35-3.65A4.4 4.4 0 0 0 20 14.83a4.4 4.4 0 0 0-.8-5.6 4.4 4.4 0 0 0-2.85-4.88A4.4 4.4 0 0 0 12 2z"/>
                        <circle cx="12" cy="12" r="3.2" stroke="#FFFFFF" stroke-width="1.5"/>
                    </svg>
                </div>`;
            }

            if (domain.includes('google.')) {
                return `<div class="shortcut-icon-box" style="background: #ffffff;">
                    <svg width="26" height="26" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                </div>`;
            }

            const initial = (title || domain || '★').trim().charAt(0).toUpperCase();
            const colorIdx = hashString(domain || title) % BRAND_COLORS.length;
            const bgGrad = BRAND_COLORS[colorIdx];
            return `<div class="shortcut-icon-box" style="background: ${bgGrad}; font-weight: 800; font-size: 20px; color: #ffffff;">
                ${initial}
            </div>`;
        }

        function renderShortcuts(bookmarksList) {
            const hasBookmarks = Array.isArray(bookmarksList) && bookmarksList.length > 0;
            const items = hasBookmarks ? bookmarksList.slice(0, 8) : DEFAULT_SHORTCUTS;

            shortcutsGridEl.innerHTML = items.map(item => {
                const domain = getDomain(item.url);
                const titleStr = (item.title || domain || 'Sivu').trim();
                const safeTitle = titleStr.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                const safeUrl = (item.url || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                const safeDomain = domain.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                const iconHtml = getIconHtml(item.url, item.title);

                return `
                    <a class="shortcut-card" href="${safeUrl}" title="${safeTitle} • ${safeUrl}">
                        ${iconHtml}
                        <div class="shortcut-text">
                            <div class="shortcut-title">${safeTitle}</div>
                            <div class="shortcut-desc">${safeDomain}</div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        function notifyParent(action, payload = {}) {
            if (window.ipc && window.ipc.postMessage) {
                window.ipc.postMessage(JSON.stringify({ action, ...payload }));
            }
        }

        window.onBrowserStateUpdate = function(state) {
            if (!state) return;
            if (Array.isArray(state.bookmarks)) {
                try {
                    localStorage.setItem(BOOKMARKS_CACHE_KEY, JSON.stringify(state.bookmarks));
                } catch {}
                renderShortcuts(state.bookmarks);
            }
            if (state.settings) {
                document.documentElement.dataset.theme = state.settings.dark_mode ? 'dark' : 'light';
            }
        };

        // Render cached immediately for instantaneous display
        try {
            const cached = localStorage.getItem(BOOKMARKS_CACHE_KEY);
            renderShortcuts(cached ? JSON.parse(cached) : null);
        } catch {
            renderShortcuts(null);
        }

        // Request live data from backend
        notifyParent('request_initial_state');
    </script>
</body>
</html>
