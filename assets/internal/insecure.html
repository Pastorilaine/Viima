<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="ins.page_title">Yhteys ei ole suojattu — Viima</title>
    <link rel="icon" type="image/png" href="viima-logo.png">
    <style>
        :root { --bg: #0f1117; --card: #181b24; --text: #f8fafc; --dim: #94a3b8; --warn: #f59e0b; --border: rgba(255,255,255,.08); --btn: #252934; color-scheme: dark; }
        :root[data-theme="light"] { --bg: #eef1f6; --card: #fff; --text: #0f172a; --dim: #52607a; --warn: #b45309; --border: rgba(15,23,42,.1); --btn: #eceff3; color-scheme: light; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 20px; }
        .card { max-width: 560px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 32px; }
        svg { color: var(--warn); margin-bottom: 16px; }
        h1 { font-size: 22px; margin-bottom: 12px; }
        p { color: var(--dim); line-height: 1.55; margin-bottom: 10px; font-size: 14px; }
        code { word-break: break-all; color: var(--text); }
        .actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
        button { border: 1px solid var(--border); background: var(--btn); color: var(--text); padding: 9px 16px; border-radius: 8px; font-size: 13.5px; cursor: pointer; }
        button.primary { background: #0284c7; border-color: #0284c7; color: #fff; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <h1 data-i18n="ins.title">Sivusto ei tue salattua yhteyttä</h1>
        <p data-i18n="ins.body">HTTPS-tila on päällä, mutta tähän osoitteeseen ei saatu suojattua (https) yhteyttä. Salaamattomassa yhteydessä muut verkon käyttäjät voivat nähdä tai muuttaa sivun sisältöä.</p>
        <p><code id="target"></code></p>
        <p data-i18n="ins.advice">Älä syötä salasanoja tai maksutietoja salaamattomalle sivulle.</p>
        <div class="actions">
            <button class="primary" id="btnBack" data-i18n="ins.back">Palaa turvaan</button>
            <button id="btnContinue" data-i18n="ins.continue">Jatka salaamattomana</button>
        </div>
    </div>
    <script src="i18n.js"></script>
    <script>
        const target = new URLSearchParams(location.search).get('url') || '';
        const valid = /^http:\/\//i.test(target);
        document.getElementById('target').textContent = target;
        document.getElementById('btnContinue').hidden = !valid;
        document.getElementById('btnBack').addEventListener('click', () => {
            if (history.length > 1) history.back();
            else window.ipc?.postMessage(JSON.stringify({ action: 'navigate', url: 'browser://newtab' }));
        });
        document.getElementById('btnContinue').addEventListener('click', () => {
            if (valid) window.ipc?.postMessage(JSON.stringify({ action: 'allow_http', url: target }));
        });
        window.onBrowserStateUpdate = state => {
            if (state.settings) document.documentElement.dataset.theme = state.settings.dark_mode ? 'dark' : 'light';
        };
    </script>
</body>
</html>
