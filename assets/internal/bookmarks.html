<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="bm.page_title">Kirjanmerkit — Viima</title>
    <link rel="icon" type="image/png" href="viima-logo.png">
    <style>
        :root {
            --bg-page: #0f1117;
            --bg-card: #181b24;
            --bg-card-hover: #212532;
            --bg-control: #252934;
            --bg-control-hover: #333846;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --border-card: rgba(255, 255, 255, 0.08);
            --star-gold: #f59e0b;
            color-scheme: dark;
        }

        :root[data-theme="light"] {
            --bg-page: #eef1f6;
            --bg-card: #ffffff;
            --bg-card-hover: #f4f7fb;
            --bg-control: #eceff3;
            --bg-control-hover: #dfe3e9;
            --text-main: #0f172a;
            --text-dim: #52607a;
            --accent: #0284c7;
            --border-card: rgba(15, 23, 42, 0.1);
            --star-gold: #d97706;
            color-scheme: light;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-page); color: var(--text-main); padding: 40px 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 860px; }
        .header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; border-bottom: 1px solid var(--border-card); padding-bottom: 16px; }
        .header-title-box { display: flex; align-items: center; gap: 12px; }
        .title { font-size: 24px; font-weight: 600; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .btn { background: var(--bg-control); color: var(--text-main); border: 1px solid var(--border-card); padding: 7px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
        .btn:hover { background: var(--bg-control-hover); }
        .bar-toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-dim); cursor: pointer; margin-right: 6px; }
        .notice { margin-bottom: 16px; padding: 10px 14px; border-radius: 8px; background: rgba(56, 189, 248, 0.12); color: var(--accent); font-size: 13px; }
        .folder-title { display: flex; align-items: center; gap: 8px; margin: 22px 0 10px; font-size: 14px; font-weight: 600; color: var(--text-dim); }
        .folder-title svg { color: var(--star-gold); }
        .bookmarks-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (max-width: 680px) { .bookmarks-grid { grid-template-columns: 1fr; } }
        .bookmark-card { min-width: 0; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; transition: background .15s ease, border-color .15s ease; }
        .bookmark-card:hover { background: var(--bg-card-hover); border-color: rgba(56, 189, 248, 0.35); }
        .bookmark-icon { width: 30px; height: 30px; border-radius: 8px; background: rgba(245, 158, 11, 0.12); display: grid; place-items: center; flex-shrink: 0; color: var(--star-gold); overflow: hidden; }
        .bookmark-icon img { width: 18px; height: 18px; }
        .bookmark-main { display: block; flex: 1; min-width: 0; color: inherit; text-decoration: none; overflow: hidden; }
        .bookmark-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bookmark-url { font-size: 12px; color: var(--text-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .folder-input { width: 110px; background: var(--bg-control); color: var(--text-main); border: 1px solid var(--border-card); border-radius: 6px; padding: 4px 8px; font-size: 12px; outline: none; }
        .folder-input:focus { border-color: var(--accent); }
        .bookmark-remove { border: 0; background: transparent; color: var(--text-dim); font-size: 20px; cursor: pointer; padding: 4px 6px; }
        .bookmark-remove:hover { color: #ef4444; }
        .empty-state { padding: 32px; text-align: center; color: var(--text-dim); background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title-box">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--star-gold)" stroke="var(--star-gold)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
                <h1 class="title" data-i18n="bm.title">Kirjanmerkit</h1>
            </div>
            <div class="header-actions">
                <label class="bar-toggle"><input type="checkbox" id="toggleBar"> <span data-i18n="bm.toggle_bar">Näytä kirjanmerkkipalkki</span></label>
                <button class="btn" id="btnImport" data-i18n="bm.import">Tuo HTML</button>
                <button class="btn" id="btnExport" data-i18n="bm.export">Vie HTML</button>
                <input type="file" id="fileImport" accept=".html,.htm,text/html" hidden>
            </div>
        </div>
        <div class="notice" id="notice" hidden></div>
        <datalist id="folderList"></datalist>
        <div id="content"></div>
    </div>
    <script src="i18n.js"></script>
    <script>
        const content = document.getElementById('content');
        const notice = document.getElementById('notice');
        const folderList = document.getElementById('folderList');
        const toggleBar = document.getElementById('toggleBar');
        const send = (action, payload = {}) => window.ipc?.postMessage(JSON.stringify({ action, ...payload }));
        let bookmarks = [];

        const FOLDER_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>';

        function card(item) {
            const el = document.createElement('div');
            el.className = 'bookmark-card';
            const icon = document.createElement('div');
            icon.className = 'bookmark-icon';
            icon.textContent = '★';
            try {
                const u = new URL(item.url);
                const img = document.createElement('img');
                img.alt = '';
                img.referrerPolicy = 'no-referrer';
                img.src = `${u.origin}/favicon.ico`;
                img.addEventListener('load', () => icon.replaceChildren(img), { once: true });
            } catch {}
            const link = document.createElement('a');
            link.className = 'bookmark-main';
            link.href = item.url;
            const title = document.createElement('div');
            title.className = 'bookmark-title';
            title.textContent = item.title || item.url;
            const url = document.createElement('div');
            url.className = 'bookmark-url';
            url.textContent = item.url;
            link.append(title, url);
            const folder = document.createElement('input');
            folder.className = 'folder-input';
            folder.value = item.folder || '';
            folder.placeholder = t('bm.bar', 'Kirjanmerkkipalkki');
            folder.title = t('bm.folder_hint', 'Tyhjä = kirjanmerkkipalkki. Kirjoita kansion nimi siirtääksesi kirjanmerkin.');
            folder.setAttribute('list', 'folderList');
            folder.addEventListener('change', () => send('set_bookmark_folder', { url: item.url, folder: folder.value.trim() }));
            folder.addEventListener('keydown', (e) => { if (e.key === 'Enter') folder.blur(); });
            const remove = document.createElement('button');
            remove.className = 'bookmark-remove';
            remove.type = 'button';
            remove.title = t('bm.remove', 'Poista kirjanmerkki');
            remove.textContent = '×';
            remove.addEventListener('click', () => send('remove_bookmark', { url: item.url }));
            el.append(icon, link, folder, remove);
            return el;
        }

        function render() {
            content.replaceChildren();
            if (!bookmarks.length) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.textContent = t('bm.empty', 'Kirjanmerkkejä ei ole vielä tallennettu.');
                content.appendChild(empty);
                return;
            }
            const folders = [''].concat([...new Set(bookmarks.map(b => b.folder || '').filter(Boolean))].sort((a, b) => a.localeCompare(b)));
            folderList.replaceChildren(...folders.filter(Boolean).map(f => Object.assign(document.createElement('option'), { value: f })));
            for (const f of folders) {
                const items = bookmarks.filter(b => (b.folder || '') === f);
                if (!items.length) continue;
                const heading = document.createElement('div');
                heading.className = 'folder-title';
                heading.innerHTML = FOLDER_ICON;
                heading.append(document.createTextNode(f || t('bm.bar', 'Kirjanmerkkipalkki')));
                const grid = document.createElement('div');
                grid.className = 'bookmarks-grid';
                items.forEach(item => grid.appendChild(card(item)));
                content.append(heading, grid);
            }
        }

        // Netscape Bookmark File: the format every browser imports and exports.
        function parseNetscape(html) {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const out = [];
            for (const a of doc.querySelectorAll('a[href]')) {
                const url = a.getAttribute('href');
                if (!/^https?:\/\//i.test(url)) continue;
                // Folder = the nearest <H3> heading of the enclosing <DL>.
                let folder = '';
                const dl = a.closest('dl');
                const dt = dl && dl.parentElement && dl.parentElement.closest('dt');
                const h3 = dt && dt.querySelector(':scope > h3');
                if (h3 && !h3.hasAttribute('personal_toolbar_folder')) folder = h3.textContent.trim();
                out.push({ title: a.textContent.trim(), url, folder });
            }
            return out;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        }

        function exportNetscape() {
            const line = b => `        <DT><A HREF="${escapeHtml(b.url)}" ADD_DATE="${b.added_at || 0}">${escapeHtml(b.title || b.url)}</A>\n`;
            let html = '<!DOCTYPE NETSCAPE-Bookmark-file-1>\n<!-- This is an automatically generated file. -->\n' +
                '<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n<TITLE>Bookmarks</TITLE>\n<H1>Bookmarks</H1>\n<DL><p>\n' +
                '    <DT><H3 PERSONAL_TOOLBAR_FOLDER="true">Viima</H3>\n    <DL><p>\n';
            bookmarks.filter(b => !b.folder).forEach(b => { html += line(b); });
            html += '    </DL><p>\n';
            for (const f of [...new Set(bookmarks.map(b => b.folder).filter(Boolean))]) {
                html += `    <DT><H3>${escapeHtml(f)}</H3>\n    <DL><p>\n`;
                bookmarks.filter(b => b.folder === f).forEach(b => { html += line(b); });
                html += '    </DL><p>\n';
            }
            html += '</DL><p>\n';
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
            a.download = `viima-kirjanmerkit-${new Date().toISOString().slice(0, 10)}.html`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        }

        window.onBrowserStateUpdate = state => {
            if (state.settings) {
                document.documentElement.dataset.theme = state.settings.dark_mode ? 'dark' : 'light';
                toggleBar.checked = Boolean(state.settings.show_bookmarks_bar);
            }
            if (state.bookmarks) {
                bookmarks = state.bookmarks;
                // Don't rebuild while the user is typing a folder name.
                if (!(document.activeElement && document.activeElement.classList.contains('folder-input'))) render();
            }
        };

        toggleBar.addEventListener('change', () => send('set_setting', { key: 'show_bookmarks_bar', value: toggleBar.checked }));
        document.getElementById('btnExport').addEventListener('click', exportNetscape);
        const fileInput = document.getElementById('fileImport');
        document.getElementById('btnImport').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', async () => {
            const file = fileInput.files && fileInput.files[0];
            fileInput.value = '';
            if (!file) return;
            const items = parseNetscape(await file.text());
            const before = bookmarks.length;
            send('import_bookmarks', { items });
            notice.hidden = false;
            notice.textContent = items.length
                ? t('bm.imported', '{n} kirjanmerkkiä tuotu.', { n: items.length })
                : t('bm.import_none', 'Tiedostosta ei löytynyt uusia kirjanmerkkejä.');
            // Rust skips duplicates: show the real count once the new list arrives.
            setTimeout(() => {
                const added = bookmarks.length - before;
                notice.textContent = added > 0
                    ? t('bm.imported', '{n} kirjanmerkkiä tuotu.', { n: added })
                    : t('bm.import_none', 'Tiedostosta ei löytynyt uusia kirjanmerkkejä.');
            }, 600);
        });
        send('request_initial_state');
    </script>
</body>
</html>
