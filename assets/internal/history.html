<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="hist.page_title">Selaushistoria — Viima</title>
    <link rel="icon" type="image/png" href="viima-logo.png">
    <style>
        :root {
            --bg-page: #0f1117;
            --bg-card: #181b24;
            --bg-card-hover: #212532;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --border-card: rgba(255, 255, 255, 0.08);
            --danger: #ef4444;
            color-scheme: dark;
        }

        :root[data-theme="light"] {
            --bg-page: #eef1f6;
            --bg-card: #ffffff;
            --bg-card-hover: #f4f7fb;
            --text-main: #0f172a;
            --text-dim: #52607a;
            --accent: #0284c7;
            --border-card: rgba(15, 23, 42, 0.1);
            --danger: #dc2626;
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-card);
            padding-bottom: 16px;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
        }

        .btn-clear {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.25);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-clear:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        .search-bar {
            width: 100%;
            padding: 11px 14px 11px 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }

        .search-bar:focus {
            border-color: var(--accent);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item { display: flex; align-items: center; gap: 16px; padding: 14px 16px; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 10px; }
        .history-link { flex: 1; min-width: 0; color: inherit; text-decoration: none; }
        .history-link:hover .history-title { color: var(--accent); }
        .history-title { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .history-url, .history-time { color: var(--text-dim); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
        .history-time { opacity: .8; }
        @media (max-width: 560px) { .history-item { align-items: flex-start; } }

        .empty-state {
            color: var(--text-dim);
            text-align: center;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 10px;
        }

        .private-note { display: none; margin-bottom: 16px; padding: 10px 14px; border-radius: 8px; background: rgba(168, 85, 247, 0.14); color: #c084fc; font-size: 13px; }
        html[data-private] .private-note { display: block; }

        .empty-icon {
            opacity: 0.4;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title-box">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <h1 class="title" data-i18n="hist.title">Selaushistoria</h1>
            </div>
            <button class="btn-clear" id="btnClearHistory" data-i18n="hist.clear">Tyhjennä historia</button>
        </div>

        <div class="private-note" data-i18n="hist.private">Yksityinen ikkuna: tässä ikkunassa avattuja sivuja ei tallenneta historiaan.</div>

        <div class="search-box">
            <span class="search-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </span>
            <input type="text" class="search-bar" id="historySearch" placeholder="Hae historiasta..." data-i18n-placeholder="hist.search">
        </div>

        <div class="history-list" id="historyList">
            <div class="empty-state" data-i18n="hist.hint">Selaushistoria tallentuu automaattisesti käydyistä sivuista.</div>
        </div>
    </div>

    <script src="i18n.js"></script>
    <script>
        const btnClear = document.getElementById('btnClearHistory');
        const historyList = document.getElementById('historyList');
        const historySearch = document.getElementById('historySearch');
        const send = (action, payload = {}) => window.ipc?.postMessage(JSON.stringify({ action, ...payload }));
        const dateFormat = new Intl.DateTimeFormat(window.viimaLang === 'en' ? 'en-GB' : 'fi-FI', { dateStyle: 'medium', timeStyle: 'short' });
        let searchTimer = 0;

        function renderHistory(items, query) {
            historyList.replaceChildren();
            if (!items.length) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.textContent = query
                    ? t('hist.no_results', 'Hakua vastaavia sivuja ei löytynyt.')
                    : t('hist.empty', 'Selaushistoria on tyhjä.');
                historyList.appendChild(empty);
                return;
            }
            for (const item of items) {
                const row = document.createElement('div');
                row.className = 'history-item';
                const link = document.createElement('a');
                link.className = 'history-link';
                link.href = item.url;
                const title = document.createElement('div');
                title.className = 'history-title';
                title.textContent = item.title || item.url;
                const url = document.createElement('div');
                url.className = 'history-url';
                url.textContent = item.url;
                const time = document.createElement('div');
                time.className = 'history-time';
                const visits = item.visit_count === 1
                    ? t('hist.visit_1', '1 käynti')
                    : t('hist.visits', '{n} käyntiä', { n: item.visit_count });
                time.textContent = `${dateFormat.format(new Date(item.visited_at * 1000))} · ${visits}`;
                link.append(title, url, time);
                const remove = document.createElement('button');
                remove.className = 'btn-clear';
                remove.type = 'button';
                remove.textContent = t('hist.delete', 'Poista');
                remove.addEventListener('click', () => send('delete_history_item', { url: item.url }));
                row.append(link, remove);
                historyList.appendChild(row);
            }
        }

        window.onBrowserStateUpdate = state => {
            if (state.settings && typeof state.settings.dark_mode === 'boolean') {
                document.documentElement.dataset.theme = state.settings.dark_mode ? 'dark' : 'light';
            }
            if (state.history) renderHistory(state.history, state.history_query || '');
        };
        // Full-text search runs in SQLite (FTS5): the whole history, not just the latest pages.
        historySearch.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => send('search_history', { q: historySearch.value.trim() }), 150);
        });
        btnClear.addEventListener('click', () => {
            if (confirm(t('hist.confirm', 'Haluatko varmasti tyhjentää koko selaushistorian?'))) {
                send('clear_history');
            }
        });
        // A freshly opened page starts with an empty search.
        send('search_history', { q: '' });
    </script>
</body>
</html>
