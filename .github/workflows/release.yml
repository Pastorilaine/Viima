name: Build & Release Viima

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Julkaisun tagi (esim. v0.3.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Release & Setup
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-11)
        with:
          toolchain: stable
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-audit
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit

      - name: Audit dependencies (RustSec)
        run: cargo audit

      - name: Run Tests & Clippy
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings

      - name: Build Release Binaries & Setup Packages
        shell: pwsh
        env:
          VIIMA_SIGNING_KEY: ${{ secrets.VIIMA_SIGNING_KEY }}
        run: |
          .\scripts\build_release.ps1

      - name: Determine Release Tag
        id: vars
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:INPUT_TAG_NAME) {
            $tag = $env:INPUT_TAG_NAME
          }
          if (-not $tag -or $tag -eq 'main' -or $tag -eq 'master') {
            $manifest = Get-Content "releases\latest\latest.json" | ConvertFrom-Json
            $tag = "v$($manifest.version)"
          }
          Write-Host "Tag: $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          # Release body = only this version's CHANGELOG section
          $ver = [regex]::Escape($tag.TrimStart('v'))
          $log = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($log, "(?ms)^## \[$ver\].*?(?=^---|^## \[|\z)")
          $notes = if ($m.Success) { $m.Value.Trim() } else { $log }
          Set-Content -Path release_notes.md -Value $notes -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Viima ${{ steps.vars.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            releases/latest/Viima-Setup.exe
            releases/latest/Viima.exe
            releases/latest/latest.json
            releases/latest/Viima_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
